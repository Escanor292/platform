name: Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tutefund_platform_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run Jest
        run: npm test -- --runInBand
      - name: Check TypeScript
        run: npx tsc --noEmit

  e2e-public-assistant:
    name: e2e-public-assistant
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tutefund_platform_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public assistant E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
